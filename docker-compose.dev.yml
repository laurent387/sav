# Environnement de développement local LIFT GMAO SAV
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Puis ouvrir http://localhost:5173/lift-gmao/  (ou http://<ip-optiplex>:5173/lift-gmao/)
# Le code est monté en volume : toute modification de src/ ou server/ est prise
# en compte à chaud (HMR Vite pour le front, node --watch pour l'API).

name: lift-gmao-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lift_gmao
      POSTGRES_USER: lift
      POSTGRES_PASSWORD: lift
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lift -d lift_gmao"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Insère les données de référence + mission Belfort au premier démarrage, puis s'arrête.
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: node server/db/init-dev.mjs
    environment: &pgenv
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: lift_gmao
      PGUSER: lift
      PGPASSWORD: lift
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: node --watch server/api.mjs
    restart: unless-stopped
    environment:
      <<: *pgenv
      API_PORT: "5000"
      CORS_ORIGIN: "*"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx vite --host 0.0.0.0 --port 5173
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:5000
      VITE_AI_PROXY_TARGET: http://ai:8787
      # Mettre à true si le rechargement à chaud ne se déclenche pas
      # (fréquent avec Docker Desktop sous Windows et un dossier sur C:\ ou E:\).
      VITE_USE_POLLING: "${VITE_USE_POLLING:-false}"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

  # Proxy IA (Flowise / LiteLLM) — optionnel :
  #   docker compose -f docker-compose.dev.yml --profile ai up
  # Les variables FLOWISE_* / LITELLM_* sont lues depuis .env / .env.local.
  ai:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: node --watch server/ai-proxy.mjs
    restart: unless-stopped
    environment:
      AI_BACKEND_PORT: "8787"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8787:8787"

volumes:
  pgdata:
